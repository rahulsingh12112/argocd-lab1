apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: child-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rahulsingh12112/argocd-lab1.git
    targetRevision: HEAD
    path: envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: child-frontend
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
